# Raise the upload size limit on the nginx reverse proxy that sits in front of
# the application on Elastic Beanstalk.
#
# WHY THIS FILE EXISTS
# nginx defaults client_max_body_size to 1 MB. Our upload form allows 5 MB, so a
# normal 2 MB transcript was rejected by nginx with a raw "413 Request Entity
# Too Large" page BEFORE the request ever reached the application. The student
# never saw our own friendly message, because our code never ran.
#
# 10 MB, not 5, on purpose: the proxy limit sits ABOVE the application limit so
# that an oversized file is refused by StudentService.SaveDocumentAsync with a
# readable message ("That file is larger than 5 MB.") instead of by nginx with
# an unstyled error page. The application stays the thing that decides.
#
# Elastic Beanstalk picks this up automatically: any .conf file under
# .platform/nginx/conf.d/ is merged into the proxy configuration on deploy.
# The .platform folder must sit at the ROOT of the deployment bundle, which is
# why Grantify.csproj copies it into the publish output.
client_max_body_size 10M;
